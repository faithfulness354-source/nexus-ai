name: Nexus Watchdog

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  # After every push to main (covers Vercel production deploys of Nexus AI).
  push:
    branches: [main]
  # When GitHub receives a deployment status (e.g. Vercel production Ready).
  deployment_status:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip SMS (dry-run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      sms_test:
        description: 'Send a one-off SMS test instead of full check'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      settle_seconds:
        description: 'Seconds to wait before probing (post-deploy settle)'
        required: false
        default: '45'

concurrency:
  group: nexus-watchdog
  cancel-in-progress: false

jobs:
  healthcheck:
    name: Live API + DB health (Discover/catalog)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Only act on successful production-ish deployments; always run schedule/push/dispatch.
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'production' ||
        github.event.deployment_status.environment == 'Production' ||
        github.event.deployment_status.environment == 'production' ||
        startsWith(github.event.deployment.environment || '', 'Production')))
    defaults:
      run:
        working-directory: nextjs_space
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Post-deploy settle
        if: github.event_name == 'push' || github.event_name == 'deployment_status'
        run: |
          set -euo pipefail
          SECONDS_WAIT=45
          echo "Waiting ${SECONDS_WAIT}s for Vercel/production to serve the new revision…"
          sleep "${SECONDS_WAIT}"

      - name: Run watchdog (Tier-1 self-heal + Tier-2 escalate)
        id: watchdog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXUS_HEALTHCHECK_BASE_URL: ${{ secrets.NEXUS_HEALTHCHECK_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXUS_HEALTHCHECK_PROFILE_USER: ${{ secrets.NEXUS_HEALTHCHECK_PROFILE_USER }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_TO_PHONE_NUMBER: ${{ secrets.ALERT_TO_PHONE_NUMBER }}
          ALERT_SMS_WEBHOOK_URL: ${{ secrets.ALERT_SMS_WEBHOOK_URL }}
          ALERT_SMS_COOLDOWN_MINUTES: ${{ secrets.ALERT_SMS_COOLDOWN_MINUTES }}
          ALERT_SMS_COOLDOWN_FILE: ${{ runner.temp }}/nexus-watchdog-sms-cooldown.json
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${NEXUS_HEALTHCHECK_BASE_URL:-}" ] && [ -z "${NEXT_PUBLIC_SITE_URL:-}" ]; then
            echo "::warning::Watchdog secrets are not configured (DATABASE_URL / site URL). Skipping live probes — this is not a Vercel build failure."
            echo "Add GitHub Actions secrets listed in docs/NEXUS_WATCHDOG.md to enable monitoring + SMS."
          fi
          ARGS=(--json)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.sms_test }}" = "true" ]; then
            npx tsx --require dotenv/config src/scripts/nexus-healthcheck.ts --sms-test
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          echo "Two-tier watchdog: probe → self-heal transient errors → escalate persistent failures…"
          set +e
          npx tsx --require dotenv/config src/scripts/nexus-healthcheck.ts "${ARGS[@]}"
          CODE=$?
          set -e
          if [ -f ../watchdog-escalation.md ]; then
            echo "Tier-2 escalation file present."
          fi
          exit "${CODE}"

      - name: Upload Tier-2 escalation artifact
        if: always() && hashFiles('watchdog-escalation.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-escalation
          path: |
            watchdog-escalation.md
            nextjs_space/data/watchdog-heal-log.jsonl
          if-no-files-found: ignore
          retention-days: 14